<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="Saadho: a day-by-day interview prep plan, with a voice practice room.">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .day  { fill: #161B22; stroke: #30363D; }
    .done { animation: tick 8s infinite; opacity: 0; }
    .d2 { animation-delay: 1s } .d3 { animation-delay: 2s } .d4 { animation-delay: 3s }
    @keyframes tick { 0%, 6% { opacity: 0 } 12%, 88% { opacity: 1 } 96%, 100% { opacity: 0 } }
    .bar { fill: #C8F169; transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s } .b5 { animation-delay: .6s }
    @keyframes talk { 0%, 100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
    @media (prefers-reduced-motion: reduce) { .done { animation: none; opacity: 1 } .bar { animation: none } }
  </style>

  <rect x="0.5" y="0.5" width="819" height="229" rx="14" fill="#0D1117" stroke="#30363D"/>

  <text x="40" y="64" class="sans" font-size="30" font-weight="800" fill="#F0F6FC" letter-spacing="1">SAADHO</text>
  <text x="40" y="142" class="sans" font-size="13" fill="#8B949E">AI/ML interview prep,</text>
  <text x="40" y="160" class="sans" font-size="13" fill="#8B949E">day by day</text>
  <rect x="40" y="84" width="118" height="26" rx="13" fill="#161B22" stroke="#34D399"/>
  <circle cx="56" cy="97" r="4" fill="#34D399"/>
  <text x="68" y="101.5" class="mono" font-size="11" fill="#34D399">live in prod</text>

  <line x1="218" y1="28" x2="218" y2="202" stroke="#21262D"/>

  <!-- role + date + hours in, a plan out -->
  <text x="246" y="44" class="mono" font-size="11" fill="#8B949E">role + interview date + daily hours  ->  a plan</text>

  <g class="mono" font-size="10.5">
    <g><rect class="day" x="246" y="58" width="100" height="70" rx="8"/><text x="258" y="78" fill="#8B949E">day 1</text><text x="258" y="100" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Transformers</text><text x="258" y="116" fill="#6E7681">2 resources</text>
      <g class="done"><circle cx="330" cy="74" r="8" fill="#34D399"/><path d="M326 74.5l3 3 5-6" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <g><rect class="day" x="354" y="58" width="100" height="70" rx="8"/><text x="366" y="78" fill="#8B949E">day 2</text><text x="366" y="100" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">RAG</text><text x="366" y="116" fill="#6E7681">3 resources</text>
      <g class="done d2"><circle cx="438" cy="74" r="8" fill="#34D399"/><path d="M434 74.5l3 3 5-6" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <g><rect class="day" x="462" y="58" width="100" height="70" rx="8"/><text x="474" y="78" fill="#8B949E">day 3</text><text x="474" y="100" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">Agents</text><text x="474" y="116" fill="#6E7681">skip: 1</text>
      <g class="done d3"><circle cx="546" cy="74" r="8" fill="#34D399"/><path d="M542 74.5l3 3 5-6" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <g><rect class="day" x="570" y="58" width="100" height="70" rx="8"/><text x="582" y="78" fill="#8B949E">day 4</text><text x="582" y="100" class="sans" font-size="12" font-weight="600" fill="#F0F6FC">System design</text><text x="582" y="116" fill="#6E7681">2 resources</text>
      <g class="done d4"><circle cx="654" cy="74" r="8" fill="#34D399"/><path d="M650 74.5l3 3 5-6" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <g><rect x="678" y="58" width="102" height="70" rx="8" fill="#C8F169"/><text x="690" y="78" fill="#3F4D1C">day 5</text><text x="690" y="100" class="sans" font-size="12" font-weight="700" fill="#0D1117">Interview</text><text x="690" y="116" fill="#3F4D1C">company guide</text></g>
  </g>

  <!-- the practice room -->
  <rect x="246" y="142" width="534" height="56" rx="8" fill="#161B22" stroke="#30363D"/>
  <g transform="translate(266 170)">
    <rect class="bar" x="0" y="-12" width="4" height="24" rx="2"/>
    <rect class="bar b2" x="8" y="-12" width="4" height="24" rx="2"/>
    <rect class="bar b3" x="16" y="-12" width="4" height="24" rx="2"/>
    <rect class="bar b4" x="24" y="-12" width="4" height="24" rx="2"/>
    <rect class="bar b5" x="32" y="-12" width="4" height="24" rx="2"/>
  </g>
  <text x="322" y="166" class="sans" font-size="13" font-weight="600" fill="#F0F6FC">Voice practice room</text>
  <text x="322" y="184" class="sans" font-size="11.5" fill="#8B949E">a group discussion with four AI colleagues, then a scorecard in your own words</text>
</svg>
