<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-label="Arush Karnatak, AI engineer. Agent infrastructure, memory for agents, and inference.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" opacity="0.07"/></pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%"><stop offset="0" stop-color="#C8F169" stop-opacity="0.13"/><stop offset="1" stop-color="#C8F169" stop-opacity="0"/></radialGradient>
    <path id="e1" d="M560 78 L655 128"/>
    <path id="e2" d="M655 128 L745 82"/>
    <path id="e3" d="M655 128 L612 205"/>
    <path id="e4" d="M655 128 L742 196"/>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .edge { stroke: #3D444D; stroke-width: 1.5; fill: none; }
    .node { fill: #0D1117; stroke: #8B949E; stroke-width: 1.5; }
    .lbl  { font-size: 10.5px; fill: #8B949E; }
    @media (prefers-reduced-motion: reduce) { .move { display: none; } }
  </style>

  <rect x="0.5" y="0.5" width="819" height="269" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="818" height="268" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="818" height="268" rx="14" fill="url(#glow)"/>

  <!-- who -->
  <text x="44" y="78" class="mono" font-size="13" fill="#8B949E">hi, I'm</text>
  <text x="44" y="126" class="sans" font-size="44" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Arush Karnatak</text>
  <rect x="44" y="146" width="132" height="30" rx="8" fill="#C8F169"/>
  <text x="110" y="166.5" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0D1117">AI engineer</text>
  <text x="44" y="210" class="sans" font-size="15.5" fill="#C9D1D9">I build the parts of an agent that sit under the model:</text>
  <text x="44" y="233" class="sans" font-size="15.5" fill="#C9D1D9">orchestration, memory, and now inference.</text>

  <!-- a small memory graph: facts move along typed edges into one node -->
  <g>
    <use href="#e1" class="edge"/><use href="#e2" class="edge"/><use href="#e3" class="edge"/><use href="#e4" class="edge" stroke-dasharray="4 5"/>
    <g class="move">
      <circle r="3.5" fill="#C8F169"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3.5" fill="#34D399"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3.5" fill="#34D399"><animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1"><mpath href="#e3"/></animateMotion></circle>
    </g>

    <circle cx="560" cy="78" r="13" class="node"/><text x="560" y="55" text-anchor="middle" class="mono lbl">agent</text>
    <circle cx="745" cy="82" r="13" class="node"/><text x="745" y="59" text-anchor="middle" class="mono lbl">PR #412</text>
    <circle cx="612" cy="205" r="13" class="node"/><text x="612" y="236" text-anchor="middle" class="mono lbl">past run</text>
    <circle cx="742" cy="196" r="13" class="node" stroke-dasharray="3 3"/><text x="742" y="227" text-anchor="middle" class="mono lbl">ended fact</text>

    <circle cx="655" cy="128" r="30" fill="#C8F169" opacity="0.12"><animate attributeName="r" values="24;34;24" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="128" r="19" fill="#C8F169"/>
    <text x="655" y="132.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0D1117">memory</text>

    <text x="598" y="96" class="mono" font-size="9.5" fill="#6E7681" transform="rotate(27 598 96)">remember</text>
    <text x="690" y="98" class="mono" font-size="9.5" fill="#6E7681" transform="rotate(-27 690 98)">RESOLVES</text>
  </g>
</svg>
